<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mis Finanzas</title>
<meta name="description" content="App de finanzas personales: gastos, ingresos, reportes y conciliación bancaria.">
<meta name="theme-color" content="#EDEAE1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <div class="install-banner" id="installBanner">📲 Instala esta app en tu celular — toca aquí</div>
  <header class="topbar">
    <div class="store">Mis Finanzas</div>
    <div class="sub" id="topbarSub"></div>
  </header>

  <main id="main">
    <section class="screen" id="screen-inicio"></section>
    <section class="screen" id="screen-ingresos"></section>
    <section class="screen" id="screen-reporte"></section>
    <section class="screen" id="screen-conciliacion"></section>
    <section class="screen" id="screen-ajustes"></section>
  </main>

  <nav class="bottom-nav" id="bottomNav">
    <button data-screen="inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Inicio
    </button>
    <button data-screen="ingresos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      Ingresos
    </button>
    <button data-screen="reporte">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Reporte
    </button>
    <button data-screen="conciliacion">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      Banco
    </button>
    <button data-screen="ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Ajustes
    </button>
  </nav>
</div>

<div class="modal-overlay" id="photoModal"><div class="modal-box"><img id="photoModalImg" src="" alt="Foto del ticket"><button id="closePhotoModal" class="close-modal">Cerrar</button></div></div>

<script src="js/db.js"></script>
<script src="js/categories.js"></script>
<script src="js/ai.js"></script>
<script src="js/state.js"></script>
<script src="js/screens/inicio.js"></script>
<script src="js/screens/ingresos.js"></script>
<script src="js/screens/reporte.js"></script>
<script src="js/screens/conciliacion.js"></script>
<script src="js/screens/ajustes.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
</body>
</html>
